name: Mise à jour stats football

on:
  schedule:
    - cron: '0 4 * * *'   # 04h00 UTC = 06h00 heure française (été)
    - cron: '0 8 * * *'   # 08h00 UTC = 10h00 heure française (été)
    - cron: '0 12 * * *'  # 12h00 UTC = 14h00 heure française (été)
    - cron: '0 16 * * *'  # 16h00 UTC = 18h00 heure française (été)
    - cron: '0 20 * * *'  # 20h00 UTC = 22h00 heure française (été)
    - cron: '0 0 * * *'   # 00h00 UTC = 02h00 heure française (été)
  workflow_dispatch:

concurrency:
  group: stats-update
  cancel-in-progress: false

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Lancer le script
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: node fetch-stats.js

      - name: Sauvegarder les fichiers
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git stash
          git pull --rebase origin main
          git stash pop
          git add data.json photos.json photos-index.json players/ sitemap.xml
          git diff --staged --quiet || git commit -m "Stats du $(date '+%d/%m/%Y a %Hh%M')"
          git push
