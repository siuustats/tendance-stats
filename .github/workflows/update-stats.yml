name: Mise à jour stats football

on:
  schedule:
    - cron: '0 13 * * *'  # 13h00 UTC = 15h00 heure française (été)
    - cron: '0 16 * * *'  # 16h00 UTC = 18h00 heure française (été)
    - cron: '0 19 * * *'  # 19h00 UTC = 21h00 heure française (été)
    - cron: '0 21 * * *'  # 21h00 UTC = 23h00 heure française (été)
    - cron: '0 23 * * *'  # 23h00 UTC = 01h00 heure française (été)
    - cron: '0 1 * * *'   # 01h00 UTC = 03h00 heure française (été)
  workflow_dispatch:

concurrency:
  group: stats-update
  cancel-in-progress: false

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Lancer le script
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: node fetch-stats.js

      - name: Sauvegarder les fichiers
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git stash
          git pull --rebase origin main
          git stash pop
          git add data.json photos.json photos-index.json players/ sitemap.xml
          git diff --staged --quiet || git commit -m "Stats du $(date '+%d/%m/%Y a %Hh%M')"
          git push
